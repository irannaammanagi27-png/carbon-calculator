services:
  - type: web
    name: carbon-calculator-frontend
    runtime: static
    rootDir: carbon-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://carbon-calculator-4.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
