version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: carbon_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: carbon_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: bhadra2476/carbon-backend:latest
    container_name: carbon_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://carbon_mysql:3306/carbon_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
    depends_on:
      - mysql

  frontend:
    image: bhadra2476/carbon-frontend:latest
    container_name: carbon_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: