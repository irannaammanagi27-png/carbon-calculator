services:
  mysql:
    image: mysql:8.0
    container_name: carbon_mysql
    environment:
      MYSQL_DATABASE: carbon_calculator
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: carbon_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/carbon_calculator?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - mysql

  frontend:
    build: ../carbon-frontend
    container_name: carbon_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: